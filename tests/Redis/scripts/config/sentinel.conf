# Node 1(10.10.1.2): Vanilla Redis
# Node 2(10.10.1.3): Redis Replica
# Node 3(10.10.1.4): Redis Sentinel

dir "/tmp"
daemonize no
sentinel deny-scripts-reconfig yes
sentinel monitor vanilla_redis 10.10.1.4 16379 2
bind 0.0.0.0
sentinel failover-timeout vanilla_redis 10000
sentinel config-epoch vanilla_redis 3
sentinel leader-epoch vanilla_redis 3

sentinel down-after-milliseconds vanilla_redis 5000