benchmark:
  num_keys: 1000
  value_length: 10000
  test_duration: 10s
  rps: 2000
  zipf_alpha: 1.00001
  timeout: 1s
  retry_count: 3
  # file_path: ./full.jsonl
  file_path: ./lite.jsonl
  remote_script:
    # experiment_type: full
    experiment_type:
      lite: [4, "1024"]
    remote_addr: leveldb-server
    crash_time: 5s
redis:
  connection:
    addr:
      Tcp: ["leveldb-server", 6379]
      # Tcp: ["localhost", 6379]
    db: 0
  pool:
    max_size: 16