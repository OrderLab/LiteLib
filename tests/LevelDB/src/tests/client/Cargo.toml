[package]
name = "client"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-mutex = "1.4.0"
config = "0.14.0"
# deadpool-redis = { version = "0.14.0", features = ["serde"] }
deadpool-redis = { path = "./lib/deadpool-redis", features = ["serde"] }
dotenvy = "0.15.7"
duration-str = "0.7.1"
indicatif = "0.17.8"
rand = "0.8.5"
redis = { version = "0.25.2", features = ["disable-client-setinfo"] }
serde = "1.0.197"
serde_json = "1.0.115"
tokio = { version = "1.37.0", features = ["full"] }
zipf = "7.0.1"
