services:
  leveldb:
    container_name: leveldb-server
    image: lite-sys
    tty: true
    privileged: true
    volumes:
      - type: bind
        source: .
        target: /workspace
    cpuset: "0-3"
    ports:
      - "6379:6379"
    entrypoint: /workspace/scripts/leveldb/entrypoint.sh
  client:
    container_name: leveldb-client
    image: rust:bookworm
    tty: true
    privileged: true
    cpuset: "4-31"
    volumes:
      - type: bind
        source: .
        target: /workspace
    entrypoint: /workspace/scripts/client/entrypoint.sh