services:
  leveldb:
    container_name: leveldb-server
    build:
      context: .
      dockerfile: ./scripts/leveldb/Dockerfile
    tty: true
    privileged: true
    volumes:
      - type: bind
        source: .
        target: /workspace
    deploy:
      resources:
        limits:
          cpus: '4'
    ports:
      - "6379:6379"
    entrypoint: /workspace/scripts/leveldb/entrypoint.sh
  client:
    container_name: leveldb-client
    image: rust:bookworm
    tty: true
    privileged: true
    volumes:
      - type: bind
        source: .
        target: /workspace
    entrypoint: /workspace/scripts/client/entrypoint.sh