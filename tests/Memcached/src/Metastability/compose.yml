services:
  client:
    container_name: client
    image: ubuntu:18.04
    # image: meta-client:v0
    tty: true
    privileged: true
    networks:
      local_net:
        ipv4_address: 10.0.233.3
    volumes:
      - type: bind
        source: .
        target: /workspace
  web:
    container_name: web
    # image: ubuntu/nginx:1.18-20.04_beta
    image: wyveo/nginx-php-fpm:php72
    # image: meta-web:v0
    command: ["/start.sh"]
    tty: true
    privileged: true
    networks:
      local_net:
        ipv4_address: 10.0.233.4
    environment:
      - TZ=America/Detroit
    volumes:
      - type: bind
        source: .
        target: /workspace
    deploy:
      resources:
        limits:
          cpus: '4'
  mysql:
    container_name: mysql
    image: ubuntu/mysql:8.0-20.04_beta
    tty: true
    privileged: true
    networks:
      local_net:
        ipv4_address: 10.0.233.5
    environment:
      - MYSQL_ROOT_PASSWORD=hello@123
    volumes:
      - type: bind
        source: .
        target: /workspace
      # The 34.6M-row database takes hours to initialize. Preserve only its
      # files between runs; every service/container is still restarted.
      - mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '4'
  memcached:
    container_name: memcached
    # image: ubuntu:18.04
    image: debian:12-slim
    # image: meta-memcached:v0
    tty: true
    privileged: true
    cgroup: host
    networks:
      local_net:
        ipv4_address: 10.0.233.6
        # and manually configure 10.0.233.7
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ../lite-version
        target: /lite-version
      # lite-version/Lite is a repository symlink to the shared framework.
      - type: bind
        source: ../../../../src
        target: /src
      - type: bind
        source: /usr/local/include
        target: /usr/local/include
        read_only: true
      - type: bind
        source: /usr/local/lib
        target: /usr/local/lib
        read_only: true
      - type: bind
        source: /sys/fs/cgroup
        target: /sys/fs/cgroup
networks:
  local_net:
    ipam:
      driver: default
      config:
        - subnet: 10.0.233.0/24
volumes:
  mysql_data: