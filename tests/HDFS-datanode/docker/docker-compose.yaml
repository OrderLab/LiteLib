version: "2"
services:
   namenode:
      image: apache/hadoop:3
      hostname: namenode
      command: ["hdfs", "namenode"]
      user: root
      env_file:
        - ./namenode_config
      tty: true
      environment:
          ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
      volumes:
        - type: bind
          source: ./namenode
          target: /workspace 
   datanode:
      image: apache/hadoop:3
      hostname: datanode
      command: ["hdfs", "datanode"]
      user: root
      env_file:
        - ./datanode_config  
      tty: true    
      volumes:
        - type: bind
          source: ./datanode
          target: /workspace 
   lite:
      hostname: lite
      build:
        context: .
        dockerfile: ./lite/Dockerfile
      volumes:
        - type: bind
          source: /home/maizhezh/cascade
          target: /workspace 
      tty: true

